<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="52" font-size="26" font-weight="700" fill="#1c1c1c">Nivel 1 · Diagrama de contexto</text><text x="40" y="80" font-size="15" fill="#666">FoodExpress y las personas y sistemas externos con los que interactúa</text><path d="M300,350 L300,470 L560,470" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#punta)"/><rect x="226.35" y="450.0" width="173.3" height="40" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="313.0" y="465.0" font-size="13" fill="#333" text-anchor="middle">Consulta menús, hace y</text><text x="313.0" y="481.0" font-size="13" fill="#333" text-anchor="middle">sigue sus pedidos</text><path d="M1300,350 L1300,470 L1040,470" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#punta)"/><rect x="1200.35" y="450.0" width="173.3" height="40" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="1287.0" y="465.0" font-size="13" fill="#333" text-anchor="middle">Gestiona el menú y los</text><text x="1287.0" y="481.0" font-size="13" fill="#333" text-anchor="middle">pedidos</text><path d="M700,610 L700,755 L460,755" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#punta)"/><rect x="551.8249999999999" y="743.0" width="108.95" height="24" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="606.3" y="758.0" font-size="13" fill="#333" text-anchor="middle">Envía correos</text><path d="M900,610 L900,755 L1140,755" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#punta)"/><rect x="942.8000000000001" y="743.0" width="101.80000000000001" height="24" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="993.7" y="758.0" font-size="13" fill="#333" text-anchor="middle">Envía avisos</text><path d="M160,755 L110,755 L110,245 L160,245" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#punta)"/><rect x="41.224999999999994" y="488.0" width="137.55" height="24" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="110.0" y="503.0" font-size="13" fill="#333" text-anchor="middle">Entrega el correo</text><circle cx="300.0" cy="168" r="28" fill="#08427b" stroke="#062f57" stroke-width="1.2"/><rect x="160" y="184.8" width="280" height="165.2" rx="26" fill="#08427b" stroke="#062f57" stroke-width="1.2"/><text x="300.0" y="249.4" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Cliente</text><text x="300.0" y="271.4" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Persona]</text><text x="300.0" y="293.4" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">Consulta menús, hace pedidos con</text><text x="300.0" y="310.3" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">extras y notas, y sigue su estado.</text><circle cx="1300.0" cy="168" r="28" fill="#08427b" stroke="#062f57" stroke-width="1.2"/><rect x="1160" y="184.8" width="280" height="165.2" rx="26" fill="#08427b" stroke="#062f57" stroke-width="1.2"/><text x="1300.0" y="240.9" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Personal del restaurante</text><text x="1300.0" y="262.9" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Persona]</text><text x="1300.0" y="284.9" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">Administra el menú y la</text><text x="1300.0" y="301.8" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">disponibilidad, y gestiona los</text><text x="1300.0" y="318.7" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">pedidos en cocina.</text><rect x="560" y="420" width="480" height="190" rx="10" fill="#1168bd" stroke="#0b3d6e" stroke-width="1.2"/><text x="800.0" y="493.0" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">FoodExpress</text><text x="800.0" y="515.0" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Sistema de software]</text><text x="800.0" y="537.0" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">Conecta restaurantes con clientes: publica menús, recibe</text><text x="800.0" y="553.9" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">pedidos, sigue su estado y avisa a cada parte.</text><rect x="160" y="680" width="300" height="150" rx="10" fill="#8a8a8a" stroke="#6b6b6b" stroke-width="1.2"/><text x="310.0" y="733.0" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Servicio de correo</text><text x="310.0" y="755.0" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Sistema externo]</text><text x="310.0" y="777.0" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">Entrega al cliente los correos de</text><text x="310.0" y="793.9" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">confirmación y de pedido listo.</text><rect x="1140" y="680" width="300" height="150" rx="10" fill="#8a8a8a" stroke="#6b6b6b" stroke-width="1.2"/><text x="1290.0" y="733.0" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Servicio de avisos al celular</text><text x="1290.0" y="755.0" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Sistema externo]</text><text x="1290.0" y="777.0" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">Muestra avisos del pedido en el</text><text x="1290.0" y="793.9" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">celular del cliente.</text><text x="1180" y="30" font-size="12" font-weight="700" fill="#555">LEYENDA</text><rect x="1180" y="44" width="18" height="14" rx="3" fill="#08427b"/><text x="1206" y="56" font-size="12.5" fill="#444">Persona</text><rect x="1180" y="68" width="18" height="14" rx="3" fill="#1168bd"/><text x="1206" y="80" font-size="12.5" fill="#444">Sistema en alcance</text><rect x="1180" y="92" width="18" height="14" rx="3" fill="#8a8a8a"/><text x="1206" y="104" font-size="12.5" fill="#444">Sistema externo</text></svg>