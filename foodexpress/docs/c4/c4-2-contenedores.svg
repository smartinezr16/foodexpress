anchor="middle">Personal del restaurante</text><text x="1515.0" y="234.9" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Persona]</text><text x="1515.0" y="256.9" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">Opera la cocina y el menú.</text><rect x="620" y="350" width="520" height="140" rx="10" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><text x="880.0" y="398.0" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Aplicación web</text><text x="880.0" y="420.0" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[React 19 · Nginx 1.27 · [frontend]]</text><text x="880.0" y="442.0" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">Interfaz de clientes y cocina. Nginx sirve la SPA y enruta /api y /ws</text><text x="880.0" y="458.9" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">a cada servicio.</text><rect x="110" y="580" width="380" height="170" rx="10" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><text x="300.0" y="634.5" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Restaurantes y Menú</text><text x="300.0" y="656.5" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Spring Boot 3.5 · [restaurantes-service]]</text><text x="300.0" y="678.5" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">Restaurantes, menú con categorías y extras,</text><text x="300.0" y="695.4" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">disponibilidad e inventario. Caché de menús</text><text x="300.0" y="712.3" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">(Caffeine).</text><rect x="690" y="580" width="380" height="170" rx="10" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><text x="880.0" y="643.0" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Pedidos</text><text x="880.0" y="665.0" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Spring Boot 3.5 · [pedidos-service]]</text><text x="880.0" y="687.0" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">Crea pedidos validando el menú, máquina de estados</text><text x="880.0" y="703.9" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">(State), totales con Builder.</text><rect x="1270" y="580" width="380" height="170" rx="10" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><text x="1460.0" y="643.0" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Notificaciones</text><text x="1460.0" y="665.0" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Spring Boot 3.5 · [notificaciones-service]]</text><text x="1460.0" y="687.0" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">Consume eventos y notifica por correo, WebSocket</text><text x="1460.0" y="703.9" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">(STOMP) y push mediante adaptadores.</text><path d="M110,844 L110,956 A120.0,14 0 0 0 350,956 L350,844" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><ellipse cx="230.0" cy="844" rx="120.0" ry="14" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><text x="230.0" y="893.5" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Base de Restaurantes</text><text x="230.0" y="915.5" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[PostgreSQL 16]</text><text x="230.0" y="937.5" font-size="13" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[postgres-restaurantes]</text><path d="M660,844 L660,956 A100.0,14