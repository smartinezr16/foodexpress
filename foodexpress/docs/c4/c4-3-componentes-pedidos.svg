t-size="13" fill="#333" text-anchor="middle">Implementa</text><path d="M450,930 L450,1030" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#punta)"/><rect x="457.275" y="968.0" width="37.45" height="24" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="476.0" y="983.0" font-size="13" fill="#333" text-anchor="middle">SQL</text><path d="M880,930 L880,1030" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#punta)"/><rect x="885.7" y="968.0" width="44.6" height="24" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="908.0" y="983.0" font-size="13" fill="#333" text-anchor="middle">HTTP</text><path d="M1415,930 L1415,1030" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#punta)"/><rect x="1422.7" y="968.0" width="44.6" height="24" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="1445.0" y="983.0" font-size="13" fill="#333" text-anchor="middle">AMQP</text><rect x="640" y="110" width="480" height="100" rx="10" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><text x="880.0" y="155.0" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Aplicación web</text><text x="880.0" y="177.0" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Contenedor · React + Nginx]</text><rect x="560" y="305" width="380" height="100" rx="10" fill="#85bbf0" stroke="#0b3d6e" stroke-width="1.2"/><text x="750.0" y="341.5" font-size="17" font-weight="700" font-style="normal" fill="#10243e" text-anchor="middle">PedidoController</text><text x="750.0" y="363.5" font-size="12" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">[Componente · Spring MVC]</text><text x="750.0" y="385.5" font-size="13" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">API REST /api/pedidos.</text><rect x="980" y="305" width="380" height="100" rx="10" fill="#85bbf0" stroke="#0b3d6e" stroke-width="1.2"/><text x="1170.0" y="341.5" font-size="17" font-weight="700" font-style="normal" fill="#10243e" text-anchor="middle">GlobalExceptionHandler</text><text x="1170.0" y="363.5" font-size="12" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">[Componente · Spring MVC]</text><text x="1170.0" y="385.5" font-size="13" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">Traduce errores de negocio a problem detail.</text><rect x="110" y="480" width="470" height="120" rx="10" fill="#85bbf0" stroke="#0b3d6e" stroke-width="1.2"/><text x="345.0" y="526.5" font-size="17" font-weight="700" font-style="normal" fill="#10243e" text-anchor="middle">Casos de uso</text><text x="345.0" y="548.5" font-size="12" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">[Componente · Java]</text><text x="345.0" y="570.5" font-size="13" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">CrearPedido, AvanzarEstado, CancelarPedido, ConsultarPedidos.</text><rect x="650" y="480" width="460" height="120" rx="10" fill="#85bbf0" stroke="#0b3d6e" stroke-width="1.2"/><text x="880.0" y="518.0" font-size="17" font-weight="700" font-style="normal" fill="#10243e" text-anchor="middle">Pedido + PedidoBuilder</text><text x="880.0" y="540.0" font-size="12" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">[Componente · dominio · patrón Builder]</text><text x="880.0" y="562.0" font-size="13" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">Agregado raíz; PedidoLocal y PedidoDelivery (LSP). Calcula</text><text x="880.0" y="578.9" font-size="13" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">totales.</text><rect x="1180" y="480" width="470" height="120" rx="10" fill="#85bbf0" stroke="#0b3d6e" stroke-width="1.2"/><text x="1415.0" y="526.5" font-size="17" font-weight="700" font-style="normal" fill="#10243e" text-anchor="middle">EstadoPedido</text><text x="1415.0" y="548.5" font-size="12" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">[Componente · dominio · patrón State]</text><text x="1415.0" y="570.5" font-size="13" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">Recibido, EnPreparacion, Listo, Entregado, Cancelado.</text><rect x="110" y="640" width="1540" height="100" rx="10" fill="#dbe9f8" stroke="#0b3d6e" stroke-width="1.2"/><text x="880.0" y="676.5" font-size="17" font-weight="700" font-style="normal" fill="#10243e" text-anchor="middle">Puertos de salida: PedidoRepository · MenuRepository · PedidoEventPublisher</text><text x="880.0" y="698.5" font-size="12" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">[Interfaces · DIP]</text><text x="880.0" y="720.5" font-size="13" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">Lo que los casos de uso necesitan, sin saber cómo se implementa.</text><rect x="110" y="830" width="470" height="100" rx="10" fill="#85bbf0" stroke="#0b3d6e" stroke-width="1.2"/><text x="345.0" y="866.5" font-size="17" font-weight="700" font-style="normal" fill="#10243e" text-anchor="middle">PedidoRepositoryAdapter</text><text x="345.0" y="888.5" font-size="12" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">[Componente · Spring Data JPA]</text><text x="345.0" y="910.5" font-size="13" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">Mapea el dominio a entidades JPA; @Version.</text><rect x="650" y="830" width="460" height="100" rx="10" fill="#85bbf0" stroke="#0b3d6e" stroke-width="1.2"/><text x="880.0" y="866.5" font-size="17" font-weight="700" font-style="normal" fill="#10243e" text-anchor="middle">MenuRepositoryRestAdapter</text><text x="880.0" y="888.5" font-size="12" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">[Componente · RestClient]</text><text x="880.0" y="910.5" font-size="13" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">Consulta el menú vigente.</text><rect x="1180" y="830" width="470" height="100" rx="10" fill="#85bbf0" stroke="#0b3d6e" stroke-width="1.2"/><text x="1415.0" y="866.5" font-size="17" font-weight="700" font-style="normal" fill="#10243e" text-anchor="middle">PedidoEventPublisherRabbit</text><text x="1415.0" y="888.5" font-size="12" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">[Componente · Spring AMQP]</text><text x="1415.0" y="910.5" font-size="13" font-weight="400" font-style="normal" fill="#10243e" text-anchor="middle">Publica los eventos en JSON.</text><path d="M305,1044 L305,1096 A145.0,14 0 0 0 595,1096 L595,1044" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><ellipse cx="450.0" cy="1044" rx="145.0" ry="14" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><text x="450.0" y="1072.0" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">pedidos_db</text><text x="450.0" y="1094.0" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[PostgreSQL]</text><rect x="705" y="1030" width="350" height="80" rx="10" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><text x="880.0" y="1065.0" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">Restaurantes y Menú</text><text x="880.0" y="1087.0" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Contenedor · Spring Boot]</text><path d="M1254,1030 L1576,1030 A14,40.0 0 0 1 1576,1110 L1254,1110 A14,40.0 0 0 1 1254,1030" fill="#438dd5" stroke="#0b3d6e" stroke-width="1.2"/><ellipse cx="1576" cy="1070.0" rx="14" ry="40.0" fill="none" stroke="#0b3d6e" stroke-width="1.2"/><text x="1407.0" y="1065.0" font-size="17" font-weight="700" font-style="normal" fill="#fff" text-anchor="middle">RabbitMQ</text><text x="1407.0" y="1087.0" font-size="12" font-weight="400" font-style="normal" fill="#fff" text-anchor="middle">[Contenedor · broker]</text><text x="1480" y="30" font-size="12" fo